<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recoveries Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brand:#0f5c5d; --brand-strong:#0b4546; --brand-soft:#e3f0ef; --accent:#d97706;
  --bg:#f5f6f7; --surface:#ffffff; --surface-2:#f0f2f3; --line:#e2e5e8; --line-strong:#cfd4d8;
  --ink:#16202a; --ink-2:#4a5560; --ink-3:#7b8590;
  --good:#15803d; --good-soft:#e7f5ec; --warn:#b45309; --warn-soft:#fdf2e3; --bad:#b91c1c; --bad-soft:#fdeaea; --info:#1d4ed8; --info-soft:#e8eefc;
  --c-collected:#0f6e6f; --c-outstanding:#e7a24a;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--ink-3)} .small{font-size:12px}
.hidden{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.brand b{display:block;font-size:15px}
.brand span{font-size:12px;color:var(--ink-3)}
.nav{padding:6px 10px;flex:1;overflow:auto}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:9px 14px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-weight:500;margin:1px 0}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--brand-soft);color:var(--brand-strong);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.nav .badge.soft{background:var(--surface-2);color:var(--ink-2)}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.me{border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.me .who{flex:1;min-width:0}
.me .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who span{font-size:11px;color:var(--ink-3);text-transform:capitalize}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{font-size:18px;margin:0;font-weight:650;flex:1}
.search{position:relative;width:min(340px,40vw)}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2)}
.search svg{position:absolute;left:11px;top:9px;width:16px;height:16px;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--brand);color:#fff}
.content{padding:24px 28px 60px;max-width:1500px;width:100%}
.banner{background:var(--warn-soft);color:var(--warn);padding:8px 28px;font-size:13px;border-bottom:1px solid #f4dcb8}
.top .menu-btn{display:none}

/* ---------- generic ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-strong)}
.btn.danger{color:var(--bad);border-color:#efc4c4}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:14.5px;font-weight:650;flex:1}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.open{background:var(--info-soft);color:var(--info)}
.pill.partial{background:var(--warn-soft);color:var(--warn)}
.pill.recovered,.pill.verified{background:var(--good-soft);color:var(--good)}
.pill.written_off,.pill.rejected{background:var(--bad-soft);color:var(--bad)}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.grey{background:var(--surface-2);color:var(--ink-2)}
.age{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.age.a0{background:#eef6f6;color:#1f5f60}.age.a1{background:#fdf6e3;color:#8a6100}.age.a2{background:#fdefd9;color:#9a5300}.age.a3{background:#fde4cc;color:#a14700}.age.a4{background:#fbd5c0;color:#a23a12}.age.a5{background:#f8c4b8;color:#992516}.age.a6{background:#f3b0ae;color:#8b1414}
.empty{padding:40px;text-align:center;color:var(--ink-3)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar select,.toolbar input[type=text],.toolbar input[type=search]{padding:7px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);min-width:140px}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-weight:500;color:var(--ink-2)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--ink-3);font-weight:550;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.kpi.alert .v{color:var(--bad)}
.kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--line-strong)}

/* ---------- charts ---------- */
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:140px 1fr 190px;gap:12px;align-items:center;padding:6px 0;cursor:default}
.hbar .nm{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{display:flex;gap:2px;height:14px}
.hbar .seg1{background:var(--c-collected);border-radius:4px 0 0 4px}
.hbar .seg2{background:var(--c-outstanding);border-radius:0 4px 4px 0}
.hbar .seg1:last-child{border-radius:4px}.hbar .seg2:first-child{border-radius:4px}
.hbar .vals{font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.hbar:hover .nm{color:var(--brand)}
.vbars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px;border-bottom:1px solid var(--line-strong)}
.vbars .col{min-width:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:default}
.vbars .bar{width:100%;max-width:46px;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.vbars .col:hover .bar{filter:brightness(1.15)}
.vbars .top-l{font-size:11px;color:var(--ink-2);margin-bottom:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.vlabels{display:flex;gap:10px;margin-top:6px}
.vlabels div{flex:1;text-align:center;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tip{position:fixed;pointer-events:none;background:#1b2530;color:#fff;font-size:12px;padding:7px 10px;border-radius:7px;z-index:200;max-width:280px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:none;white-space:pre-line}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;max-height:calc(100vh - 240px)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;color:var(--ink-2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;z-index:1}
table.t th.sortable{cursor:pointer} table.t th.sortable:hover{color:var(--ink)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:#f8fafa}
table.t tfoot td{position:sticky;bottom:0;background:var(--surface-2);font-weight:650;border-top:1px solid var(--line-strong)}
td.wrap{max-width:240px;white-space:normal}
td.ref{white-space:nowrap}
.why.mini{font-size:10.5px;padding:1px 6px;display:inline-block;margin-top:3px}
td.clip{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:60px}
.prog>i{display:block;height:100%;background:var(--good)}

/* ---------- drawer & modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,23,30,.35);z-index:50;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);background:var(--surface);z-index:60;box-shadow:-8px 0 30px rgba(0,0,0,.15);transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{padding:18px 22px;border-bottom:1px solid var(--line)}
.drawer .db{flex:1;overflow:auto;padding:18px 22px}
.x{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.x:hover{background:var(--surface-2)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;margin:14px 0}
.facts>div>span:first-child{display:block;font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em}
.facts div b{font-weight:600;word-break:break-word}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 12px}
.tabs button{all:unset;padding:8px 12px;cursor:pointer;color:var(--ink-3);font-weight:600;border-bottom:2px solid transparent}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tl .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--surface-2)}
.tl .ic.rcpt{background:var(--good-soft);color:var(--good)}
.tl .ic.promise{background:var(--warn-soft);color:var(--warn)}
.tl .meta{font-size:12px;color:var(--ink-3)}
.modal-wrap{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding:60px 16px;background:rgba(15,23,30,.4);overflow:auto}
.modal-wrap.on{display:flex}
.modal{background:var(--surface);border-radius:12px;width:min(620px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{width:min(980px,100%)}
.modal .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;flex:1;font-size:16px}
.modal .mb{padding:18px 20px}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 12px 12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.form input,.form select,.form textarea{padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-weight:400;color:var(--ink)}
.form textarea{min-height:70px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus,.toolbar select:focus{outline:2px solid #9cc9c8;outline-offset:0;border-color:var(--brand)}
.hint{font-size:12px;color:var(--ink-3);font-weight:400}
.note{padding:10px 12px;border-radius:8px;background:var(--info-soft);color:#1e3a8a;font-size:13px}
.note.good{background:var(--good-soft);color:#14532d}
.note.warn{background:var(--warn-soft);color:#7c2d12}
.note.bad{background:var(--bad-soft);color:#7f1d1d}
.drop{border:2px dashed var(--line-strong);border-radius:10px;padding:26px;text-align:center;color:var(--ink-2);cursor:pointer;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
#toasts{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:#1b2530;color:#fff;padding:10px 16px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:13.5px;max-width:380px}
.toast.good{background:var(--good)} .toast.bad{background:var(--bad)}

/* ---------- reminders ---------- */
.rem{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.rem:last-child{border-bottom:0}
.rem .why{font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap}
.why.p1{background:#f1f2f4;color:#374151}.why.p2{background:var(--bad-soft);color:var(--bad)}.why.p3{background:var(--warn-soft);color:var(--warn)}.why.p4{background:var(--info-soft);color:var(--info)}.why.p5{background:var(--surface-2);color:var(--ink-2)}
.rem>*{min-width:0}
.rem h4{margin:0;font-size:14px;overflow-wrap:anywhere}
.rem .acts{flex-wrap:wrap}
.rem .acts{display:flex;gap:6px}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0f5c5d 0%,#0b3b3c 100%)}
.auth .box{background:var(--surface);border-radius:14px;padding:30px;width:min(440px,100%);box-shadow:0 30px 60px rgba(0,0,0,.25)}
.auth h2{margin:10px 0 4px}
.auth .form{grid-template-columns:1fr}
.demo-users{display:grid;gap:6px;margin-top:14px}
.demo-users button{all:unset;display:flex;justify-content:space-between;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.demo-users button:hover{border-color:var(--brand);background:var(--brand-soft)}

@media (max-width:1100px){.g2,.g3{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:70;transform:translateX(-105%);transition:transform .2s}
  .side.on{transform:none}
  .top .menu-btn{display:inline-grid}
  .top{padding:12px 16px}.content{padding:16px 16px 60px}
  .search{display:none}
  .hbar{grid-template-columns:96px 1fr;}.hbar .vals{grid-column:1/-1;text-align:left}
  .form{grid-template-columns:1fr}
  .rem{grid-template-columns:1fr}
  .vbars,.vlabels{gap:4px}.vbars .top-l{display:none}.card-h{flex-wrap:wrap}
}
</style>
</head>

<div id="toasts"></div>

<div class="modal-wrap" id="modal"></div>

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now());
const round2 = n => Math.round((+n || 0) * 100) / 100;
const fmt = (n, d = 2) => (n == null || isNaN(n)) ? '–' : Number(n).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const fmtK = n => { n = +n || 0; const a = Math.abs(n); return a >= 1e6 ? (n/1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M' : a >= 1e3 ? (n/1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K' : n.toFixed(0); };
const pct = n => (n == null || isNaN(n)) ? '–' : (n * 100).toFixed(n > 0 && n < 0.1 ? 1 : 0) + '%';
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoOf(d); };
const daysSince = iso => iso ? Math.floor((new Date(todayISO() + 'T00:00:00') - new Date(String(iso).slice(0, 10) + 'T00:00:00')) / 864e5) : null;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fdate = iso => { if (!iso) return '–'; const s = String(iso).slice(0, 10).split('-'); return `${s[2]} ${MON[+s[1] - 1]} ${s[0]}`; };
const fdt = ts => { if (!ts) return '–'; const d = new Date(ts); return `${pad(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const num = v => { if (v == null || v === '') return null; if (typeof v === 'number') return v; const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? null : n; };
const initials = s => String(s || '?').split(/[\s.]+/).filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join('');
const agingIndex = d => AGING.findIndex(a => d <= a[0]);
const agingChip = d => { if (d == null) return ''; const i = agingIndex(d); return `<span class="age a${i}" title="${AGING[i][1]}">${d}d</span>`; };
const by = (k, dir = 1) => (a, b) => { const x = typeof k === 'function' ? k(a) : a[k], y = typeof k === 'function' ? k(b) : b[k]; return (x > y ? 1 : x < y ? -1 : 0) * dir; };
const debounce = (fn, ms = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const store = { get(k, d) { try { const v = localStorage.getItem('rrt_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem('rrt_' + k, JSON.stringify(v)); } catch {} } };

function toast(msg, type = '') {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), type === 'bad' ? 6000 : 3500);
}

/* ---- tiny IndexedDB for demo-mode POP files ---- */
const idb = {
  db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => {
    const r = indexedDB.open('rrt_pops', 1); r.onupgradeneeded = () => r.result.createObjectStore('f');
    r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  async put(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('f', 'readwrite'); t.objectStore('f').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('f').objectStore('f').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
};

/* ---- shared business rule: status follows the money (mirrors the DB trigger) ---- */
function applyStatus(r) {
  if (r.status !== 'written_off') {
    if (r.recovery_amount > 0 && r.recovered_to_date >= r.recovery_amount - 0.005) r.status = 'recovered';
    else if (r.recovered_to_date > 0) r.status = 'partial';
    else r.status = 'open';
  }
  if (r.status === 'recovered' || r.status === 'written_off') { r.closed_at = r.closed_at || new Date().toISOString(); r.next_follow_up = null; }
  else r.closed_at = null;
  return r;
}

const Demo = {
  KEY: 'rrt_demo_v1', d: null,
  load() {
    if (this.d) return this.d;
    try { this.d = JSON.parse(localStorage.getItem(this.KEY)); } catch { this.d = null; }
    if (!this.d) { this.d = this.seed(); this.save(); }
    return this.d;
  },
  seed() {
    const p = (full_name, role, controller_name = null) => ({id: uid(), email: full_name.toLowerCase().replace(/[^a-z]+/g, '.') + '@demo.local', full_name, role, controller_name, active: true, email_reminders: true});
    const profiles = [p('Samuel Moyo', 'admin'), p('Finance Officer', 'finance'), p('Claims Officer', 'claims'), p('Management (read-only)', 'viewer'),
      ...DEMO_CONTROLLERS.map(n => p(n, 'credit_control', n))];
    return {seq: 0, profiles, reinsurers: DEMO_REINSURERS.map(name => ({id: uid(), name, active: true, default_controller: null, contact_email: '', contact_name: ''})),
      settings: {follow_up_days: 7, promise_grace_days: 0, require_pop: true}, recoveries: [], receipts: [], activities: [], audit: []};
  },
  save() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.d)); }
    catch (e) { toast('Browser storage is full — demo data could not be saved. Connect Supabase for real use.', 'bad'); }
  },
  audit(table, id, action, changed) { this.d.audit.push({id: this.d.audit.length + 1, table_name: table, record_id: id, action, changed, actor: S.me?.id, at: new Date().toISOString()}); if (this.d.audit.length > 20000) this.d.audit.splice(0, 2000); },
  diff(o, n) { const d = {}; for (const k in n) if (!['updated_at','updated_by'].includes(k) && JSON.stringify(o[k]) !== JSON.stringify(n[k])) d[k] = {from: o[k] ?? null, to: n[k] ?? null}; return d; },
  recompute(rid) {
    const r = this.d.recoveries.find(x => x.id === rid); if (!r) return;
    const before = {...r};
    r.recovered_to_date = round2(this.d.receipts.filter(c => c.recovery_id === rid && c.status !== 'rejected').reduce((s, c) => s + +c.amount, 0));
    applyStatus(r); r.updated_at = new Date().toISOString();
    const df = this.diff(before, r); if (Object.keys(df).length) this.audit('recoveries', rid, 'update', df);
  }
};

};

  edit: () => ['admin','finance','claims'].includes(role()),
  receipt: () => ['admin','finance','credit_control'].includes(role()),
  verify: () => ['admin','finance'].includes(role()),

  writeoff: () => ['admin','finance'].includes(role()),
  admin: () => role() === 'admin'
};
const profileName = id => S.profiles.find(p => p.id === id)?.full_name || (id ? 'Unknown user' : 'System');
const controllers = () => {
  const set = new Set(S.profiles.filter(p => p.role === 'credit_control' && p.active && p.controller_name).map(p => p.controller_name));
  S.recoveries.forEach(r => r.responsible && set.add(r.responsible));
  return [...set].sort();
};
const activeReinsurers = () => [...new Set(S.reinsurers.filter(r => r.active !== false).map(r => r.name))].sort((a, b) => a.localeCompare(b));

function derive() {
  const rc = {}, ac = {};
  S.receipts.forEach(c => (rc[c.recovery_id] ||= []).push(c));
  S.activities.forEach(a => (ac[a.recovery_id] ||= []).push(a));
  const st = S.settings, today = todayISO();
  for (const r of S.recoveries) {
    r.claim_amount = +r.claim_amount; r.recovery_amount = +r.recovery_amount; r.ri_share = +r.ri_share;
    const rcs = (rc[r.id] || []).sort(by('created_at')); const acs = (ac[r.id] || []).sort(by('created_at'));
    r._receipts = rcs; r._acts = acs;
    r._rec = round2(rcs.filter(c => c.status !== 'rejected').reduce((s, c) => s + +c.amount, 0));
    r._out = round2(r.recovery_amount - r._rec);
    r._pct = r.recovery_amount ? r._rec / r.recovery_amount : 0;
    r._pending = round2(rcs.filter(c => c.status === 'pending').reduce((s, c) => s + +c.amount, 0));
    r._days = daysSince(r.date_sent);
    r._closed = r.status === 'recovered' || r.status === 'written_off';
    const human = acs.filter(a => a.kind !== 'system');
    const lastNote = [...human].reverse().find(a => a.note);
    r._lastComment = lastNote ? lastNote.note : '';
    r._lastCommentAt = lastNote ? lastNote.created_at : null;
    const realRcpts = rcs.filter(c => c.method !== 'Migrated');
    const lastAct = human.length ? human[human.length - 1].created_at : null;
    const lastRc = realRcpts.length ? realRcpts[realRcpts.length - 1].created_at : null;
    r._lastTouch = [lastAct, lastRc, r.created_at].filter(Boolean).sort().pop();
    const promise = [...human].reverse().find(a => a.kind === 'promise' && a.promise_date);
    // ----- reminder rules (same as SQL reminder_items) -----
    r._rem = null;
    if (!r._closed) {
      if (!r.responsible) r._rem = {p: 1};
      else if (promise && addDays(promise.promise_date, +st.promise_grace_days || 0) < today && (!lastRc || lastRc < promise.created_at)) r._rem = {p: 2, detail: 'Promised ' + fdate(promise.promise_date) + (promise.promise_amount ? ' · ' + fmt(promise.promise_amount) : '')};
      else if (r.next_follow_up && r.next_follow_up <= today) r._rem = {p: 3, detail: 'Due ' + fdate(r.next_follow_up)};
      else if (!human.length && !rcs.length && r.source !== 'excel_migration') r._rem = {p: 4, detail: 'Uploaded ' + fdt(r.created_at) + ' by ' + profileName(r.created_by)};
      else if ((!r.next_follow_up || r.next_follow_up <= today) && daysSince(r._lastTouch) > (+st.follow_up_days || 7)) r._rem = {p: 5, detail: 'Last action ' + fdate(r._lastTouch) + ' (' + daysSince(r._lastTouch) + ' days ago)'};
      if (r._rem) r._rem.reason = REASONS[r._rem.p];
    }
  }
}

async function reload(quiet) {
  try {

    else S.me = S.profiles.find(p => p.id === S.me?.id) || S.me;
    derive();
    if (!quiet) render(); else if ($('#nav')) { renderNav(); if (!$('#modal').classList.contains('on')) renderView(); if (S.drawerId) renderDrawer(); }
  } catch (e) { console.error(e); toast('Could not load data: ' + (e.message || e), 'bad'); }
}

/* ---------------------------------------------------------------------

   --------------------------------------------------------------------- */
function viewDashboard() {
  const C = S.ccy, rows = S.recoveries.filter(r => r.currency === C);
  const active = rows.filter(r => !r._closed);
  const recById = Object.fromEntries(rows.map(r => [r.id, r]));
  const rcpts = S.receipts.filter(c => recById[c.recovery_id] && c.status !== 'rejected');
  const t = todayISO(), mStart = t.slice(0, 8) + '01', yStart = t.slice(0, 5) + '01-01';
  const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
  const outstanding = sum(active, r => r._out);
  const mtd = sum(rcpts.filter(c => c.receipt_date >= mStart), c => c.amount);
  const ytd = sum(rcpts.filter(c => c.receipt_date >= yStart), c => c.amount);
  const totalDue = sum(rows.filter(r => r.status !== 'written_off'), r => r.recovery_amount), totalRec = sum(rows, r => r._rec);
  const rem = active.filter(r => r._rem).length;
  const pend = S.receipts.filter(c => c.status === 'pending' && recById[c.recovery_id]);
  const over180 = sum(active.filter(r => r._days > 180), r => r._out);

  // by reinsurer
  const ri = {};
  rows.filter(r => r.status !== 'written_off').forEach(r => { const k = r.reinsurer || 'Unspecified'; (ri[k] ||= {name: k, col: 0, out: 0, n: 0}); ri[k].col += r._rec; if (!r._closed) { ri[k].out += r._out; ri[k].n++; } });
  let riList = Object.values(ri).sort((a, b) => (b.out + b.col) - (a.out + a.col));
  if (riList.length > 10) { const rest = riList.slice(9); riList = riList.slice(0, 9); riList.push({name: `Other (${rest.length})`, col: sum(rest, x => x.col), out: sum(rest, x => x.out), n: sum(rest, x => x.n), other: true}); }
  const riMax = Math.max(1, ...riList.map(x => x.col + x.out));

  // aging
  const ag = AGING.map(a => ({label: a[1], amt: 0, n: 0}));
  active.forEach(r => { const i = agingIndex(r._days ?? 0); ag[i].amt += r._out; ag[i].n++; });
  const agMax = Math.max(1, ...ag.map(a => a.amt));

  // trend: last 12 months collections
  const months = []; const d0 = new Date(); d0.setDate(1);
  for (let i = 11; i >= 0; i--) { const d = new Date(d0.getFullYear(), d0.getMonth() - i, 1); months.push({k: `${d.getFullYear()}-${pad(d.getMonth() + 1)}`, label: MON[d.getMonth()] + ' ' + d.getFullYear(), short: MON[d.getMonth()] + (d.getMonth() === 0 || i === 11 ? " '" + String(d.getFullYear()).slice(2) : ''), amt: 0, n: 0}); }
  rcpts.forEach(c => { const m = months.find(x => x.k === String(c.receipt_date).slice(0, 7)); if (m) { m.amt += +c.amount; m.n++; } });
  const trMax = Math.max(1, ...months.map(m => m.amt));

  // controllers
  const ctl = {};
  rows.forEach(r => { const k = r.responsible || '— Unassigned —'; const x = (ctl[k] ||= {name: k, n: 0, out: 0, mtd: 0, ytd: 0, rem: 0, last: null, closed: 0});
    if (!r._closed) { x.n++; x.out += r._out; if (r._rem) x.rem++; } else if (r.status === 'recovered') x.closed++;
    r._receipts.filter(c => c.status !== 'rejected').forEach(c => { if (c.receipt_date >= mStart) x.mtd += +c.amount; if (c.receipt_date >= yStart) x.ytd += +c.amount; });
    const lt = r._acts.filter(a => a.kind !== 'system').map(a => a.created_at).concat(r._receipts.filter(c => c.method !== 'Migrated').map(c => c.created_at)).sort().pop();
    if (lt && (!x.last || lt > x.last)) x.last = lt; });
  const ctlList = Object.values(ctl).sort((a, b) => b.out - a.out);

  const recent = [...rcpts].filter(c => c.method !== 'Migrated').sort(by('created_at', -1)).slice(0, 8);

  $('#view').innerHTML = `
  <div class="kpis">
    <div class="kpi click" data-go2="register"><div class="l">Outstanding recoverable</div><div class="v">${C} ${fmtK(outstanding)}</div><div class="s">${active.length} open items · ${C} ${fmt(outstanding)}</div></div>
    <div class="kpi"><div class="l">Collected this month</div><div class="v">${C} ${fmtK(mtd)}</div><div class="s">${MON[new Date().getMonth()]} ${new Date().getFullYear()}</div></div>
    <div class="kpi"><div class="l">Collected year to date</div><div class="v">${C} ${fmtK(ytd)}</div><div class="s">since 1 Jan</div></div>
    <div class="kpi"><div class="l">Recovery rate</div><div class="v">${pct(totalDue ? totalRec / totalDue : 0)}</div><div class="s">${C} ${fmtK(totalRec)} of ${fmtK(totalDue)} ever due</div></div>
    <div class="kpi ${over180 ? 'alert' : ''}"><div class="l">Older than 180 days</div><div class="v">${C} ${fmtK(over180)}</div><div class="s">${pct(outstanding ? over180 / outstanding : 0)} of outstanding</div></div>
    <div class="kpi click ${rem ? 'alert' : ''}" data-go2="reminders"><div class="l">Need follow-up</div><div class="v">${rem}</div><div class="s">${active.filter(r => r._rem?.p === 1).length} unassigned · ${active.filter(r => r._rem?.p === 2).length} promises missed</div></div>
    <div class="kpi click" data-go2="verify"><div class="l">POPs awaiting verification</div><div class="v">${pend.length}</div><div class="s">${C} ${fmt(sum(pend, c => c.amount))}</div></div>
  </div>
  ${!S.recoveries.length ? `<div class="card" style="margin-bottom:16px"><div class="card-b"><div class="note">No recoveries yet. ${can.create() ? `Go to <a href="#" data-go2="new">Upload claims</a> to add claims or migrate your existing Excel tracker.` : 'Claims and finance will upload claims with reinsurance here.'}</div></div></div>` : ''}
  <div class="grid g2" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h3>By reinsurer</h3><div class="legend"><span><i style="background:var(--c-collected)"></i>Collected</span><span><i style="background:var(--c-outstanding)"></i>Outstanding</span></div></div>
      <div class="card-b">${riList.length ? riList.map(x => `<div class="hbar" ${x.other ? '' : `data-ri="${esc(x.name)}" style="cursor:pointer"`} data-tip="${esc(x.name)}\nCollected: ${C} ${fmt(x.col)}\nOutstanding: ${C} ${fmt(x.out)} (${x.n} open)\nRecovery rate: ${pct((x.col) / ((x.col + x.out) || 1))}">
        <div class="nm">${esc(x.name)}</div>
        <div class="track">${x.col ? `<div class="seg1" style="width:${x.col / riMax * 100}%"></div>` : ''}${x.out ? `<div class="seg2" style="width:${x.out / riMax * 100}%"></div>` : ''}</div>
        <div class="vals">${fmtK(x.col)} collected · <b>${fmtK(x.out)}</b> due</div></div>`).join('') : '<div class="empty">No data</div>'}</div></div>
    <div class="card"><div class="card-h"><h3>Outstanding by age</h3><span class="muted small">days since sent to finance</span></div>
      <div class="card-b"><div class="vbars">${ag.map(a => `<div class="col" data-tip="${a.label}\n${C} ${fmt(a.amt)}\n${a.n} item(s)"><div class="top-l">${a.amt ? fmtK(a.amt) : ''}</div><div class="bar" style="height:${a.amt / agMax * 85}%;background:var(--accent)"></div></div>`).join('')}</div>
      <div class="vlabels">${ag.map(a => `<div>${a.label.replace(' days', '')}</div>`).join('')}</div></div></div>
  </div>
  <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>By credit controller</h3><span class="muted small">${C} · click a row to open their items</span></div>
    <div class="tbl-wrap" style="max-height:none"><table class="t"><thead><tr><th>Controller</th><th class="num">Open items</th><th class="num">Outstanding</th><th class="num">Collected MTD</th><th class="num">Collected YTD</th><th class="num">Fully recovered</th><th class="num">Need follow-up</th><th>Last activity</th></tr></thead>
    <tbody>${ctlList.map(x => `<tr class="click" data-ctl="${esc(x.name)}"><td><b>${esc(x.name)}</b></td><td class="num">${x.n}</td><td class="num">${fmt(x.out)}</td><td class="num">${fmt(x.mtd)}</td><td class="num">${fmt(x.ytd)}</td><td class="num">${x.closed}</td><td class="num">${x.rem ? `<span class="pill written_off">${x.rem}</span>` : '<span class="pill recovered">0</span>'}</td><td class="muted">${x.last ? fdt(x.last) : '–'}</td></tr>`).join('') || '<tr><td colspan="8" class="empty">No data</td></tr>'}</tbody></table></div></div>
  <div class="grid g2">
    <div class="card"><div class="card-h"><h3>Collections — last 12 months</h3><span class="muted small">${C}, by receipt date</span></div>
      <div class="card-b"><div class="vbars">${months.map(m => `<div class="col" data-tip="${m.label}\n${C} ${fmt(m.amt)}\n${m.n} receipt(s)"><div class="top-l">${m.amt ? fmtK(m.amt) : ''}</div><div class="bar" style="height:${m.amt / trMax * 85}%"></div></div>`).join('')}</div>
      <div class="vlabels">${months.map(m => `<div>${m.short}</div>`).join('')}</div></div></div>
    <div class="card"><div class="card-h"><h3>Latest recoveries recorded</h3></div>
      ${recent.length ? `<table class="t"><tbody>${recent.map(c => { const r = recById[c.recovery_id]; return `<tr class="click" data-open="${r.id}"><td><b>${esc(r.reinsurer)}</b><div class="muted small">${esc(r.claim_number)} · ${esc(r.client_name)}</div></td><td class="num"><b>${fmt(c.amount)}</b><div class="muted small">${fdate(c.receipt_date)}</div></td><td><span class="pill ${c.status}">${c.status}</span></td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">No recoveries recorded yet</div>'}
    </div>
  </div>`;
  $$('#view [data-go2]').forEach(b => b.onclick = e => { e.preventDefault(); go(b.dataset.go2); });
  $$('#view [data-ri]').forEach(b => b.onclick = () => { S.f = {...S.f, reinsurer: b.dataset.ri, controller: '', aging: '', status: 'active', mine: false}; go('register'); });
  $$('#view [data-ctl]').forEach(b => b.onclick = () => { S.f = {...S.f, controller: b.dataset.ctl === '— Unassigned —' ? '__none' : b.dataset.ctl, reinsurer: '', aging: '', status: 'active', mine: false}; go('register'); });
  bindOpen();
}

  const isCC = role() === 'credit_control';
  if (isCC && !S.me.controller_name) { $('#view').innerHTML = `<div class="note warn">Your profile is not linked to a controller name yet. Ask an admin to set your “Responsible” name in Settings → Users.</div>`; return; }
  $('#view').innerHTML = `
    <div class="note" style="margin-bottom:16px">${isCC ? `These are <b>your</b> recoveries that need action today.` : `All recoveries needing action across the team.`}

/* ---------------------------------------------------------------------
   REGISTER (open & partially recovered)
   --------------------------------------------------------------------- */
const COLS = [
  {k: 'ref', l: 'Ref'}, {k: 'date_sent', l: 'Sent to finance'}, {k: '_days', l: 'Age', num: 1}, {k: 'client_name', l: 'Client'},
  {k: 'claim_number', l: 'Claim no.'}, {k: 'payee', l: 'Payee'}, {k: 'reinsurer', l: 'Reinsurer'}, {k: 'responsible', l: 'Responsible'},
  {k: 'recovery_amount', l: 'Recovery amt', num: 1}, {k: '_rec', l: 'Recovered', num: 1}, {k: '_pct', l: '%', num: 1}, {k: '_out', l: 'Outstanding', num: 1},
  {k: 'next_follow_up', l: 'Next follow-up'}, {k: '_lastComment', l: 'Latest comment'}
];
function filtered(list, f) {
  const q = (f.q || '').toLowerCase().trim();
  return list.filter(r => {
    if (f.reinsurer && r.reinsurer !== f.reinsurer) return false;
    if (f.controller === '__none' ? r.responsible : (f.controller && r.responsible !== f.controller)) return false;
    if (f.aging !== '' && f.aging != null && agingIndex(r._days ?? 0) !== +f.aging) return false;

    return true;
  });
}

  $('#modal').innerHTML = `<form class="modal ${wide ? 'wide' : ''}" id="mForm" novalidate><div class="mh"><h3>${title}</h3><button type="button" class="x" id="mX">✕</button></div>

  $('#modal').classList.add('on');
  $('#mX').onclick = $('#mCancel').onclick = closeModal;
  $('#mForm').onsubmit = async e => {
    e.preventDefault(); const form = e.target;
    const bad = [...form.elements].find(el => el.willValidate && !el.checkValidity()); if (bad) { bad.reportValidity(); return; }
    const b = $('#mGo'); b.disabled = true; const t = b.textContent; b.textContent = 'Saving…';
    try { const ok = await onSubmit(new FormData(form), form); if (ok !== false) closeModal(); }
    catch (err) { console.error(err); toast(err.message || String(err), 'bad'); }
    finally { if ($('#mGo')) { b.disabled = false; b.textContent = t; } }
  };
  onOpen && onOpen($('#mForm'));
  setTimeout(() => $('#mForm input:not([type=hidden]),#mForm select')?.focus(), 30);
}
function closeModal() { $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }

      drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files.length) { inp.files = e.dataTransfer.files; show(); } };

/* ---- reinsurer name clean-up (handles the variants found in the old tracker) ---- */
const RI_PATTERNS = [[/minerva/i, 'Minerva Re'], [/emeritus/i, 'Emeritus Re'], [/bright\s*re/i, 'Bright Re'], [/\bafc\b/i, 'AFC'], [/capit[ao]l/i, 'Capital Re'],
  [/\bzb\s*re/i, 'ZB Re'], [/grand\s*re/i, 'Grand Re'], [/\bfbc\b/i, 'FBC Re'], [/first\s*mutual|\bfmre\b/i, 'First Mutual Re'], [/\bicz\b/i, 'ICZ'], [/\bcbz\b/i, 'CBZ'],
  [/skybridge/i, 'Skybridge Re'], [/waica/i, 'WAICA Re']];
const ARR_WORDS = /retained|surplus|treaty|quota|facultative|\bxol\b/i;
function normalizeReinsurer(raw) {
  const s = String(raw || '').trim(); if (!s) return {name: 'Unspecified'};
  const exact = S.reinsurers.find(r => r.name.toLowerCase() === s.toLowerCase()); if (exact) return {name: exact.name};
  const hits = []; RI_PATTERNS.forEach(([re, n]) => { if (re.test(s) && !hits.includes(n)) hits.push(n); });
  const share = (s.match(/(\d{1,3}(?:\.\d+)?)\s*%?\s*$/) || s.match(/^(\d{1,3})\s*%/) || [])[1];
  const arr = /\bxol\b/i.test(s) ? 'XOL' : null;
  if (hits.length === 1) return {name: hits[0], arrangement: arr, shareNote: share ? share + '%' : null};
  if (hits.length > 1) return {name: hits.join(' / '), multi: true, arrangement: arr};
  if (ARR_WORDS.test(s)) return {name: 'Unspecified', arrangement: s};
  return {name: s.replace(/\s+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()).replace(/\bRe\b/i, 'Re')};
}

/* ---- Excel parsing: works for the template AND the legacy tracker layout ---- */
const HDR = {
  date_sent: ['datesenttofinance','datereceived','datesent','date'], linear_id: ['linearid'], client_name: ['clientname','client','insured'],
  claim_number: ['claimnumber','claimno','claim'], payee: ['payee'], reinsurer: ['reinsurer','reinsurers'], arrangement: ['arrangement','ritype','reinsurancetype'],
  responsible: ['responsible','creditcontroller','controller'], claim_amount: ['originalclaimamount','claimamount','originalclaim'],
  ri_share: ['reparticipantratio','rishare','share','reinsurershare','participationratio'], recovery_amount: ['recoveryamtus','recoveryamount','recoveryamt','recoveryamountzwg','recoveryamountusd'],
  recovered: ['recoveredtodate'], bank_date: ['bankdepositdate'], bank: ['banktherecoverywasdeposited','bank'], client_payment_status: ['paymentstatustoclient'],
  comment_date: ['commentdate'], comment: ['recoverycomments','comments','comment'], currency: ['currency','ccy'], notes: ['notes']
};
const normH = h => String(h || '').toLowerCase().replace(/[^a-z]/g, '');
function excelDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return isoOf(v);
  if (typeof v === 'number') { if (v < 20000 || v > 80000) return null; const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${pad(d.m)}-${pad(d.d)}` : null; }
  const s = String(v).trim(); let m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; const mo = +m[2], d = +m[1]; if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return `${y}-${pad(mo)}-${pad(d)}`; }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function parseWorkbook(wb, defaultCcy) {
  const out = {rows: [], issues: [], sheets: []};
  for (const name of wb.SheetNames) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, raw: true, defval: null});
    const hi = aoa.findIndex(r => r && r.filter(Boolean).map(normH).some(h => ['claimnumber','claimno'].includes(h)));
    if (hi < 0) continue;
    const head = aoa[hi].map(normH); const col = {};
    for (const [k, alts] of Object.entries(HDR)) { let i = head.findIndex(h => alts.includes(h)); if (i < 0) i = head.findIndex(h => alts.some(a => a.length > 6 && h.startsWith(a))); if (i >= 0) col[k] = i; }
    const ccy = /zwg|zig|zwl/i.test(name) ? 'ZWG' : /usd/i.test(name) ? 'USD' : defaultCcy;
    let n = 0;
    aoa.slice(hi + 1).forEach((r, i) => {
      if (!r || !r.some(v => v != null && v !== '')) return;
      const g = k => col[k] != null ? r[col[k]] : null;
      const claim = String(g('claim_number') ?? '').trim(), client = String(g('client_name') ?? '').trim();
      if (!claim && !client) return;
      if (String(g('responsible') || '').trim().toLowerCase() === 'total') return;
      const rowNo = hi + i + 2, issues = [];
      let claimAmt = num(g('claim_amount')), share = num(g('ri_share')), recAmt = num(g('recovery_amount'));
      if (share != null && share > 1) share = share / 100;
      if (share == null || share <= 0) share = (claimAmt && recAmt) ? Math.min(1, recAmt / claimAmt) : 1;
      if (recAmt == null && claimAmt != null) recAmt = claimAmt * share;
      if (claimAmt == null && recAmt != null) claimAmt = recAmt / share;
      if (recAmt == null) { out.issues.push(`${name} row ${rowNo}: no amount — skipped`); return; }
      const ri = normalizeReinsurer(g('reinsurer'));
      let date = excelDate(g('date_sent')); if (!date) { issues.push('no valid date sent – used today'); date = todayISO(); }
      if (!claim) issues.push('no claim number');
      if (ri.multi) issues.push(`several reinsurers on one line (${ri.name}) — consider splitting`);
      if (ri.name === 'Unspecified') issues.push('reinsurer not specified');
      const rowCcy = (String(g('currency') || '').toUpperCase().match(/USD|ZWG/) || [ccy])[0];
      const notes = [g('notes'), ri.shareNote ? `Reinsurer cell said “${g('reinsurer')}”` : null].filter(Boolean).join(' · ') || null;
      out.rows.push({sheet: name, rowNo, issues,
        rec: {currency: rowCcy, date_sent: date, linear_id: g('linear_id') != null ? String(g('linear_id')) : null, client_name: client || '(not given)', claim_number: claim || '(not given)',
          payee: g('payee') ? String(g('payee')).trim() : null, reinsurer: ri.name, arrangement: g('arrangement') || ri.arrangement || null,
          responsible: g('responsible') ? String(g('responsible')).trim() : null, claim_amount: round2(claimAmt), ri_share: Math.round(share * 1e6) / 1e6, recovery_amount: round2(recAmt),
          client_payment_status: g('client_payment_status') ? String(g('client_payment_status')).trim().replace(/^paid to client$/i, 'Paid to client').replace(/^paid$/i, 'Paid to client') : null, notes},
        recovered: num(g('recovered')) || 0, bank: g('bank') ? String(g('bank')).trim() : null, bank_date: excelDate(g('bank_date')),
        comment: g('comment') ? String(g('comment')).trim() : null, comment_date: excelDate(g('comment_date'))});
      n++;
    });
    out.sheets.push({name, ccy, n, cols: Object.keys(col)});
  }
  return out;
}

async function handleBulk(file) {
  const box = $('#bPrev'); box.innerHTML = '<div class="empty">Reading file…</div>';
  try {
    const wb = XLSX.read(await file.arrayBuffer(), {type: 'array', cellDates: false});
    const p = parseWorkbook(wb, S.ccy);
    if (!p.rows.length) { box.innerHTML = `<div class="note bad">No claim rows found. Make sure there is a header row with a “Claim Number” column.</div>`; return; }
    const isLegacy = p.rows.some(r => r.recovered > 0 || r.comment);
    // duplicates against existing data
    const key = r => [r.currency, r.claim_number, r.payee, r.reinsurer, round2(r.recovery_amount)].join('|').toLowerCase();
    const have = new Set(S.recoveries.map(key));
    p.rows.forEach(r => { r.dup = have.has(key(r.rec)); });
    const fresh = p.rows.filter(r => !r.dup);
    const newRi = [...new Set(fresh.map(r => r.rec.reinsurer))].filter(n => !S.reinsurers.some(x => x.name.toLowerCase() === n.toLowerCase()));
    const unassigned = fresh.filter(r => !r.rec.responsible).length;
    // each reinsurer's usual controller: existing default, else most common in this file
    const learned = {}; const tally = {};
    fresh.forEach(r => { if (r.rec.responsible) { const t = (tally[r.rec.reinsurer] ||= {}); t[r.rec.responsible] = (t[r.rec.responsible] || 0) + 1; } });
    Object.entries(tally).forEach(([k, t]) => learned[k] = Object.entries(t).sort((a, b) => b[1] - a[1])[0][0]);
    S.reinsurers.forEach(x => { if (x.default_controller) learned[x.name] = x.default_controller; });
    const autoN = fresh.filter(r => !r.rec.responsible && learned[r.rec.reinsurer]).length;
    const fullyDone = fresh.filter(r => r.recovered >= r.rec.recovery_amount - 0.005 && r.rec.recovery_amount > 0).length;
    const tot = c => fresh.filter(r => r.rec.currency === c).reduce((s, r) => s + r.rec.recovery_amount, 0);
    box.innerHTML = `
      <div class="note ${fresh.length ? 'good' : 'warn'}"><b>${fresh.length}</b> new recovery line(s) ready from ${p.sheets.map(s => `${esc(s.name)} (${s.n})`).join(', ')}.
        USD ${fmt(tot('USD'))} · ZWG ${fmt(tot('ZWG'))}. ${p.rows.length - fresh.length ? `<b>${p.rows.length - fresh.length}</b> already in the system — will be skipped.` : ''}</div>
      ${newRi.length ? `<div class="note" style="margin-top:8px">New reinsurer names that will be created: ${newRi.map(esc).join(', ')}. You can rename or merge them later in Settings.</div>` : ''}
      ${unassigned ? `<div class="note warn" style="margin-top:8px">${unassigned} line(s) have no responsible controller.
        ${autoN ? `<label class="chk" style="display:flex;margin-top:6px"><input type="checkbox" id="autoAs" checked> <span>Auto-assign ${autoN} of them to the controller who usually handles that reinsurer (${Object.entries(learned).slice(0, 6).map(([k, v]) => esc(k) + ' → ' + esc(v)).join(', ')}${Object.keys(learned).length > 6 ? ', …' : ''}).</span></label>` : ''}
        ${unassigned - autoN ? `<div style="margin-top:4px">${unassigned - autoN} will show as <b>Unassigned</b> in Reminders until someone assigns them.</div>` : ''}</div>` : ''}
      ${isLegacy && can.admin() ? `<label class="chk" style="margin-top:12px;display:flex"><input type="checkbox" id="mig" checked> <span><b>Migration mode</b> — bring in “Recovered To Date” as opening receipts (marked <i>Migrated</i>, verified) and the comments as activity history. ${fullyDone} line(s) are already 100% recovered and will go straight to the archive.</span></label>` : ''}
      ${isLegacy && !can.admin() ? `<div class="note warn" style="margin-top:8px">This file has recovered amounts/comments. Only an admin can migrate those — you'll upload the claims only.</div>` : ''}
      <div class="tbl-wrap" style="margin-top:12px;max-height:420px;border:1px solid var(--line);border-radius:8px"><table class="t"><thead><tr><th>Sheet/row</th><th>Ccy</th><th>Date sent</th><th>Client</th><th>Claim no.</th><th>Reinsurer</th><th>Responsible</th><th class="num">Recovery amt</th><th class="num">Recovered</th><th>Check</th></tr></thead>
        <tbody>${p.rows.slice(0, 600).map(r => `<tr style="${r.dup ? 'opacity:.45' : ''}"><td class="muted small">${esc(r.sheet)} ${r.rowNo}</td><td>${r.rec.currency}</td><td>${fdate(r.rec.date_sent)}</td><td class="clip">${esc(r.rec.client_name)}</td><td>${esc(r.rec.claim_number)}</td><td>${esc(r.rec.reinsurer)}</td><td>${esc(r.rec.responsible || '–')}</td>
          <td class="num">${fmt(r.rec.recovery_amount)}</td><td class="num">${r.recovered ? fmt(r.recovered) : ''}</td><td class="small">${r.dup ? 'Duplicate – skip' : r.issues.length ? `<span style="color:var(--warn)">${esc(r.issues.join('; '))}</span>` : '<span style="color:var(--good)">OK</span>'}</td></tr>`).join('')}</tbody></table></div>
      ${p.issues.length ? `<details style="margin-top:8px"><summary class="small muted">${p.issues.length} row(s) skipped</summary><div class="small">${p.issues.map(esc).join('<br>')}</div></details>` : ''}
      <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn" id="bCancel">Cancel</button><button class="btn primary" id="bGo" ${fresh.length ? '' : 'disabled'}>Upload ${fresh.length} line(s)</button></div>`;
    $('#bCancel').onclick = () => newBulk();
    $('#bGo').onclick = async () => {
      const b = $('#bGo'); b.disabled = true; b.textContent = 'Uploading…';
      const migrate = !!$('#mig')?.checked, auto = !!$('#autoAs')?.checked;
      try {
        await API.addReinsurers(fresh.map(r => r.rec.reinsurer));
        const rows = fresh.map(r => ({...r.rec, id: uid(), client_payment_status: r.rec.client_payment_status || 'Paid to client',
          responsible: r.rec.responsible || (auto ? learned[r.rec.reinsurer] : null) || null, source: migrate ? 'excel_migration' : 'bulk'}));
        const ins = await API.insertRecoveries(rows);
        // learn each reinsurer's usual controller so future uploads auto-assign
        const tally = {}; fresh.forEach(r => { if (r.rec.responsible) { const t = (tally[r.rec.reinsurer] ||= {}); t[r.rec.responsible] = (t[r.rec.responsible] || 0) + 1; } });
        for (const [riName, t] of Object.entries(tally)) {
          const ri = S.reinsurers.find(x => x.name === riName);
          const best = Object.entries(t).sort((a, b) => b[1] - a[1])[0][0];
          if (!ri?.default_controller && can.admin()) await API.setDefaultController(riName, best).catch(() => {});
        }
        if (migrate) {
          const rc = [], ac = [];
          fresh.forEach((r, i) => { const id = rows[i].id;
            if (r.recovered > 0) rc.push({recovery_id: id, amount: round2(r.recovered), receipt_date: r.bank_date || r.rec.date_sent, method: 'Migrated', bank: r.bank, reference: 'Opening balance migrated from Excel tracker', status: 'verified', verified_by: S.me.id, verified_at: new Date().toISOString(), verify_note: 'Migrated'});
            if (r.comment) ac.push({recovery_id: id, kind: 'note', note: r.comment + (r.comment_date ? '' : ' (from Excel tracker)'), created_at: r.comment_date ? r.comment_date + 'T08:00:00Z' : new Date().toISOString()});
          if (!r.rec.responsible && rows[i].responsible) ac.push({recovery_id: id, kind: 'system', note: `Auto-assigned to ${rows[i].responsible} (usual controller for ${r.rec.reinsurer}) during upload`}); });
          if (rc.length) await API.insertReceipts(rc);
          if (ac.length) await API.insertActivities(ac);
        }
        if (!migrate) { const aa = fresh.map((r, i) => (!r.rec.responsible && rows[i].responsible) ? {recovery_id: rows[i].id, kind: 'system', note: `Auto-assigned to ${rows[i].responsible} (usual controller for ${r.rec.reinsurer}) during upload`} : null).filter(Boolean); if (aa.length) await API.insertActivities(aa); }
        toast(`Uploaded ${ins.length} recovery line(s)`, 'good');
        await reload(true); go('register');
      } catch (err) { console.error(err); toast(err.message || String(err), 'bad'); b.disabled = false; b.textContent = 'Retry upload'; }
    };
  } catch (e) { console.error(e); box.innerHTML = `<div class="note bad">Could not read this file: ${esc(e.message)}</div>`; }
}

        <td style="white-space:nowrap"><button class="btn sm good" data-ver="${c.id}">Verify</button> <button class="btn sm danger" data-rej="${c.id}">Reject</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">All caught up — no POPs waiting.</div>'}</div>
    <div class="card"><div class="card-h"><h3>Recently verified / rejected</h3></div>
      ${recent.length ? `<table class="t"><tbody>${recent.map(({c, r}) => `<tr class="click" data-open="${r.id}"><td><b>${r.ref}</b> · ${esc(r.reinsurer)}<div class="muted small">${esc(r.claim_number)}</div></td><td class="num">${r.currency} ${fmt(c.amount)}</td><td><span class="pill ${c.status}">${c.status}</span></td><td class="muted small">${esc(profileName(c.verified_by))} · ${fdt(c.verified_at)}${c.verify_note ? '<br>' + esc(c.verify_note) : ''}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Nothing yet.</div>'}</div>`;

function verifyReceipt(id, ok) {
  const c = S.receipts.find(x => x.id === id), r = S.recoveries.find(x => x.id === c.recovery_id);
  openModal({
    title: ok ? 'Verify proof of payment' : 'Reject receipt', submit: ok ? 'Verify' : 'Reject', danger: !ok,
    body: `<p>${r.ref} · ${esc(r.reinsurer)} · <b>${r.currency} ${fmt(c.amount)}</b> received ${fdate(c.receipt_date)}${c.bank ? ' into ' + esc(c.bank) : ''}.</p>
      ${ok ? '' : `<div class="note warn" style="margin-bottom:10px">Rejecting removes this amount from “recovered to date”. If the claim was archived it comes back to the register.</div>`}
      <div class="form"><label class="full">${ok ? 'Note (optional)' : 'Reason'}<textarea name="note" ${ok ? '' : 'required'} placeholder="${ok ? 'e.g. Agreed to ZB statement 14 Oct' : 'e.g. Not on bank statement / wrong amount'}"></textarea></label></div>`,
    onSubmit: async fd => {
      await API.updateReceipt(id, {status: ok ? 'verified' : 'rejected', verified_by: S.me.id, verified_at: new Date().toISOString(), verify_note: fd.get('note') || null});
      if (!ok) await API.insertActivities([{recovery_id: r.id, kind: 'system', note: `Receipt of ${r.currency} ${fmt(c.amount)} rejected by finance: ${fd.get('note')}`}]);
      toast(ok ? 'Verified' : 'Receipt rejected', ok ? 'good' : ''); await reload(true);
    }
  });
}

  $('#view').innerHTML = `<div class="note" style="margin-bottom:14px">Every change to recoveries, receipts, reinsurers and users is recorded automatically — who, what and when. Nothing can be edited or removed from this log.</div>
    <div class="card"><div class="card-b">${auditList(a)}</div></div>`;
  $$('#view .tl li').forEach((li, i) => { const r = recOf(a[i].record_id); if (r) li.querySelector('b').insertAdjacentHTML('afterend', ` <a href="#" data-open="${r.id}">${esc(r.ref)}</a>`); });
  $$('#view a[data-open]').forEach(el => el.onclick = e => { e.preventDefault(); if (el.dataset.open) openDrawer(el.dataset.open); });
}

/* ---------------------------------------------------------------------
   SETTINGS (admin)
   --------------------------------------------------------------------- */
function viewSettings() {
  const st = S.settings; const counts = {}; S.recoveries.forEach(r => counts[r.reinsurer] = (counts[r.reinsurer] || 0) + 1);
  const ris = [...S.reinsurers].filter(r => r.id).sort((a, b) => (b.active !== false) - (a.active !== false) || a.name.localeCompare(b.name));
  $('#view').innerHTML = `
  <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Users & roles</h3>${MODE === 'demo' ? '<button class="btn sm" id="addUser">Add demo user</button>' : '<span class="muted small">People appear here after they create an account</span>'}</div>
    <div class="tbl-wrap" style="max-height:none"><table class="t"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>“Responsible” name</th><th>Email reminders</th><th>Active</th></tr></thead><tbody>
    ${S.profiles.map(p => `<tr data-pid="${p.id}"><td><b>${esc(p.full_name)}</b></td><td class="muted">${esc(p.email)}</td>
      <td><select data-f="role">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${p.role === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
      <td><input data-f="controller_name" value="${esc(p.controller_name)}" list="ctlNames" placeholder="${p.role === 'credit_control' ? 'e.g. M. Makumbe' : ''}" style="padding:5px 8px;border:1px solid var(--line-strong);border-radius:6px"></td>
      <td><input type="checkbox" data-f="email_reminders" ${p.email_reminders !== false ? 'checked' : ''}></td><td><input type="checkbox" data-f="active" ${p.active !== false ? 'checked' : ''}></td></tr>`).join('')}
    </tbody></table><datalist id="ctlNames">${controllers().map(c => `<option>${esc(c)}`).join('')}</datalist></div>
    <div class="card-b small muted">A credit controller's “Responsible” name must match the name used on recoveries (e.g. <i>M. Makumbe</i>) so their reminders and dashboard line link up.</div></div>

  <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Reinsurers</h3><button class="btn sm" id="addRi">${icon('plus')} Add</button><button class="btn sm" id="mergeRi">Merge duplicates</button></div>
    <div class="tbl-wrap" style="max-height:480px"><table class="t"><thead><tr><th>Name</th><th>Default controller</th><th>Contact email</th><th class="num">Recoveries</th><th>Active</th></tr></thead><tbody>
    ${ris.map(r => `<tr data-rid="${r.id}"><td><input data-f="name" value="${esc(r.name)}" style="padding:5px 8px;border:1px solid var(--line-strong);border-radius:6px;width:100%"></td>
      <td><select data-f="default_controller"><option value="">—</option>${opts(controllers(), r.default_controller)}</select></td>
      <td><input data-f="contact_email" value="${esc(r.contact_email)}" type="email" style="padding:5px 8px;border:1px solid var(--line-strong);border-radius:6px"></td>
      <td class="num">${counts[r.name] || 0}</td><td><input type="checkbox" data-f="active" ${r.active !== false ? 'checked' : ''}></td></tr>`).join('')}</tbody></table></div></div>

  <div class="grid g2">
    <div class="card"><div class="card-h"><h3>Reminder rules</h3></div><form class="card-b" id="rules"><div class="form">
      <label>Flag if no follow-up for (days)<input name="follow_up_days" type="number" min="1" max="90" value="${st.follow_up_days ?? 7}"></label>
      <label>Grace after a missed promise (days)<input name="promise_grace_days" type="number" min="0" max="30" value="${st.promise_grace_days ?? 0}"></label>
      <label class="full chk"><input type="checkbox" name="require_pop" ${st.require_pop !== false ? 'checked' : ''}> Proof of payment is required to record a recovery</label></div>
      <div class="row" style="margin-top:12px"><button class="btn primary">Save rules</button></div></form></div>
    <div class="card"><div class="card-h"><h3>Daily email reminders (Power Automate)</h3></div><div class="card-b small">
      ${MODE === 'supabase' ? `<p>Endpoint: <code style="word-break:break-all">${esc(CONFIG.SUPABASE_URL)}/rest/v1/rpc/reminder_digest</code></p><p>See <b>SETUP.md → Power Automate</b> for the 5-step flow. The token lives in the <code>digest_config</code> table (Supabase → SQL editor: <code>select token from digest_config;</code>).</p>`
       : '<p>Email reminders switch on once the tool is connected to Supabase. See SETUP.md.</p>'}
      </div></div>
  </div>`;
  $$('[data-pid] [data-f]').forEach(el => el.onchange = async () => { const id = el.closest('tr').dataset.pid; const f = el.dataset.f; const v = el.type === 'checkbox' ? el.checked : (el.value.trim() || null);
    try { await API.updateProfile(id, {[f]: v}); toast('Saved', 'good'); await reload(true); } catch (e) { toast(e.message, 'bad'); } });
  $$('[data-rid] [data-f]').forEach(el => el.onchange = async () => { const id = el.closest('tr').dataset.rid; const f = el.dataset.f; const v = el.type === 'checkbox' ? el.checked : (el.value.trim() || null);
    if (f === 'name' && (!v || S.reinsurers.some(r => r.name.toLowerCase() === v.toLowerCase() && r.id !== id))) { toast('That name is empty or already exists — use Merge instead', 'bad'); return viewSettings(); }
    try { await API.updateReinsurer(id, {[f]: v}); toast('Saved', 'good'); await reload(true); } catch (e) { toast(e.message, 'bad'); } });
  $('#rules').onsubmit = async e => { e.preventDefault(); const fd = new FormData(e.target);
    await API.updateSettings({follow_up_days: +fd.get('follow_up_days'), promise_grace_days: +fd.get('promise_grace_days'), require_pop: !!fd.get('require_pop')}); toast('Rules saved', 'good'); reload(true); };
  $('#addRi').onclick = () => openModal({title: 'Add reinsurer', body: `<div class="form"><label class="full">Name<input name="n" required></label></div>`, onSubmit: async fd => { await API.addReinsurers([fd.get('n').trim()]); toast('Added', 'good'); await reload(true); }});
  $('#mergeRi').onclick = () => { const names = [...new Set(S.reinsurers.map(r => r.name))].sort();
    openModal({title: 'Merge reinsurers', submit: 'Merge', body: `<p class="muted">Moves every recovery from the first name to the second and deactivates the first. Use it to clean up spelling variants (e.g. “Capitol Re” → “Capital Re”).</p>
      <div class="form"><label>Move from<select name="a">${opts(names)}</select></label><label>Into<select name="b">${opts(names)}</select></label></div>`,
      onSubmit: async fd => { const a = fd.get('a'), b = fd.get('b'); if (a === b) { toast('Pick two different names', 'bad'); return false; } const n = await API.mergeReinsurer(a, b); toast(`Moved ${n} recoveries into ${b}`, 'good'); await reload(true); }}); };
  if ($('#addUser')) $('#addUser').onclick = () => openModal({title: 'Add demo user', body: `<div class="form"><label>Name<input name="n" required></label><label>Role<select name="r">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label></div>`,
    onSubmit: async fd => { const n = fd.get('n').trim(); await API.addDemoProfile({full_name: n, email: n.toLowerCase().replace(/[^a-z]+/g, '.') + '@demo.local', role: fd.get('r'), controller_name: fd.get('r') === 'credit_control' ? n : null}); await reload(true); }});
}

/* ---------------------------------------------------------------------
   BOOT
   --------------------------------------------------------------------- */
async function boot() {
  if (MODE === 'supabase' && !sb) {
    if (!window.supabase) { $('#root').innerHTML = '<div class="empty">Could not load the Supabase library — check your internet connection.</div>'; return; }
    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') renderAuth(); if (ev === 'PASSWORD_RECOVERY') setTimeout(promptNewPassword, 300); });
  }
  const s = await API.session();
  if (!s) return renderAuth();
  S.me = {id: s.user.id};
  await reload(true).catch(() => {});
  if (!S.me || !S.me.role) { if (MODE === 'demo') { store.set('demo_user', null); return renderAuth(); } S.me = {id: s.user.id, full_name: s.user.email, role: 'viewer'}; }
  render();
  const mine = myReminders().length;
  if (mine) toast(`${mine} recover${mine === 1 ? 'y needs' : 'ies need'} follow-up — see Reminders`);
  if (!boot.subscribed) { API.subscribe(debounce(() => reload(true), 800)); boot.subscribed = true; }
}
function promptNewPassword() {
  openModal({title: 'Set a new password', body: '<div class="form"><label class="full">New password<input name="p" type="password" minlength="8" required></label></div>',
    onSubmit: async fd => { const {error} = await sb.auth.updateUser({password: fd.get('p')}); if (error) throw error; toast('Password updated', 'good'); }});
}
boot();
</script>
</body>
</html>
